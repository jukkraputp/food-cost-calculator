*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:"Figtree","IBM Plex Sans Thai",system-ui,sans-serif;font-size:14.5px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;letter-spacing:0;margin:0}
button{font-family:inherit}
input,select,textarea{font-family:inherit}

/* ---- components ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;
  font-family:var(--font-display);font-size:13.5px;color:var(--color-text);background:transparent;border:1px solid transparent;
  padding:9px 18px;border-radius:999px;transition:background .12s}
.btn-primary{background:var(--color-accent);color:#fff}
.btn-primary:hover{background:var(--color-accent-600)}
.btn-secondary{border-color:var(--color-divider);background:var(--color-surface-2)}
.btn-secondary:hover{background:var(--color-neutral-200)}
.btn-ghost{color:var(--color-accent);padding:8px 10px}
.btn-ghost:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent)}
.btn-danger{color:var(--color-danger)}
.btn-danger:hover{background:var(--color-danger-bg)}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:11.5px;color:color-mix(in srgb,var(--color-text) 68%,transparent);font-weight:600;letter-spacing:.01em}
.input,select.input{width:100%;min-height:38px;padding:7px 13px;font-size:14px;color:var(--color-text);
  background:var(--color-surface-2);border:1px solid var(--color-divider);border-radius:12px;outline:none}
.input:focus{border-color:var(--color-accent)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--color-surface-2);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow-sm)}
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}
.tag-accent-2{background:var(--color-accent-2-100);color:var(--color-accent-2-800)}
.tag-neutral{background:var(--color-neutral-200);color:var(--color-neutral-800)}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent)}
.tag-danger{background:var(--color-danger-bg);color:var(--color-danger)}
.num{white-space:nowrap;font-family:var(--font-display)}
.hr{height:1px;background:var(--color-divider);border:0;margin:2px 0}
.muted{color:rgba(32,30,29,.55)}
a{color:var(--color-accent)}

/* ---- app shell ---- */
.topbar{position:sticky;top:0;z-index:30;background:#f5ead8;border-bottom:1px solid rgba(0,0,0,.08);
  padding:14px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand .k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent)}
.brand h1{font-size:32px}
.topbar .actions{display:flex;gap:8px;align-items:center}
.filepick{position:relative;overflow:hidden}
.filepick input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.savebadge{font-size:11px;color:var(--color-accent-2-700);display:flex;align-items:center;gap:5px}
.savebadge .dot{width:7px;height:7px;border-radius:999px;background:var(--color-accent-2-600)}
.savebadge.saving{color:var(--color-accent-700)}
.savebadge.saving .dot{background:var(--color-accent-600);animation:pulse 1s ease-in-out infinite}
.savebadge.error{color:var(--color-danger)}
.savebadge.error .dot{background:var(--color-danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.tabs{position:sticky;top:60px;z-index:29;background:var(--color-bg);border-bottom:1px solid rgba(0,0,0,.06);
  display:flex;gap:4px;padding:0 22px;overflow-x:auto}
.tab-btn{border:0;background:transparent;padding:13px 16px;font-size:13.5px;font-weight:600;color:rgba(32,30,29,.55);

<body>
<div id="app"></div>

<script>
/* ============================== STATE ============================== */
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }

const FAMILY_LABEL = { mass:'กรัม/กก.', volume:'มล./ลิตร', egg:'ฟอง', piece:'ชิ้น' };
const FAMILY_BASE = { mass:'กรัม', volume:'มล.', egg:'ฟอง', piece:'ชิ้น' };
const FAMILY_UNITS = { mass:['กรัม','กก.'], volume:['มล.','ลิตร'], egg:['ฟอง'], piece:['ชิ้น'] };
const UNIT_FACTOR = { 'กรัม':1,'กก.':1000,'มล.':1,'ลิตร':1000,'ฟอง':1,'ชิ้น':1 };
const PANTRY_CATS = ['ของแห้ง/เบเกอรี่','ของสด','นม/ของเหลว','เครื่องปรุง','อื่นๆ'];
const RECIPE_CATS = ['ขนม','อาหาร','เครื่องดื่ม','อื่นๆ'];

function seedPantry(){
  return [];
}

function seedPackaging(){
  return [];
}

function seedRecipes(pantry){
  return [];
}

function seedSettings(){
  return { shopName:'ครัวของหนู', defaultLabor:60, defaultOverhead:20, defaultTarget:40 };
}

/* ============================== DATA CLIENT ==============================
   All persistence goes through this object. Every method returns a Promise
   and is commented with the REST endpoint it stands in for, so swapping the
   backing store later means rewriting only the bodies in this block (e.g.
   replace localStorage calls with fetch() calls to your API) — nothing
   elsewhere in the app needs to change.
============================================================================ */
const STORAGE_PREFIX = 'foodCostCalculator:v1:';

function localGet(key, fallback){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+key);
    return raw==null ? fallback : JSON.parse(raw);
  }catch(e){ return fallback; }
}
function localSet(key, value){ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(value)); }
function localRemove(key){ localStorage.removeItem(STORAGE_PREFIX+key); }

const api = {
  // GET /settings
  async getSettings(){ return localGet('settings', null); },
  // PUT /settings
  async saveSettings(settings){ localSet('settings', settings); return settings; },

  // GET /pantry
  async listPantry(){ return localGet('pantry', null); },
  // PUT /pantry  (bulk replace — simplest mapping for a client-held array;
  // a real API could instead expose POST/PATCH/DELETE per item)
  async savePantry(pantry){ localSet('pantry', pantry); return pantry; },

  // GET /packaging
  async listPackaging(){ return localGet('packaging', null); },
  // PUT /packaging
  async savePackaging(packaging){ localSet('packaging', packaging); return packaging; },

  // GET /recipes
  async listRecipes(){ return localGet('recipes', null); },
  // PUT /recipes
  async saveRecipes(recipes){ localSet('recipes', recipes); return recipes; },

  // DELETE /data  (reset everything)
  async clearAll(){ localRemove('settings'); localRemove('pantry'); localRemove('packaging'); localRemove('recipes'); },
};

let state = { settings: null, pantry: [], packaging: [], recipes: [] };

let ui = { tab:'recipes', recipeId:null, search:'', pantrySearch:'', pantryEditing:null, pantryAdding:false,
  packagingSearch:'', packagingEditing:null, packagingAdding:false,
  showShareModal:false, shareCode:'', selectionMode:false, selectedIds:new Set(),
  showImportModal:false, importError:'', importText:'',
  quick:{ mat:100, pack:10, labor:30, gas:10, delivery:0, overhead:15, yieldQty:10, target:35, sell:0 } };

/* ============================== PERSISTENCE ============================== */
let saveStatus = 'idle'; // idle | saving | saved | error
let persistTimer = null;

async function persistAll(){
  saveStatus = 'saving';
  updateSaveBadge();
  try{
    await Promise.all([
      api.saveSettings(state.settings),
      api.savePantry(state.pantry),
      api.savePackaging(state.packaging),
      api.saveRecipes(state.recipes),
    ]);
    saveStatus = 'saved';
  }catch(err){
    console.error('Failed to save data', err);
    saveStatus = 'error';
  }
  updateSaveBadge();
}
function schedulePersist(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(persistAll, 300);
}
function updateSaveBadge(){
  const el = document.getElementById('saveBadge');
  if(!el) return;
  const map = {
    idle:{cls:'', text:'บันทึกอัตโนมัติในเครื่องนี้'},
    saving:{cls:'saving', text:'กำลังบันทึก...'},
    saved:{cls:'', text:'บันทึกแล้ว'},
    error:{cls:'error', text:'บันทึกไม่สำเร็จ'},
  };
  const s = map[saveStatus] || map.idle;
  el.className = 'savebadge '+s.cls;
  el.innerHTML = `<span class="dot"></span>${s.text}`;
}

async function bootstrap(){
  app.innerHTML = `<div style="padding:60px 20px;text-align:center;color:rgba(32,30,29,.55)">กำลังโหลดข้อมูล...</div>`;
  const [settings, pantry, packaging, recipes] = await Promise.all([api.getSettings(), api.listPantry(), api.listPackaging(), api.listRecipes()]);
  if(settings && pantry && recipes){
    // packaging is a newer collection — default it without discarding existing data
    state = {settings, pantry, packaging: packaging || seedPackaging(), recipes};
    if(!packaging) await persistAll();
  } else {
    state.settings = seedSettings();
    state.pantry = seedPantry();
    state.packaging = seedPackaging();
    state.recipes = seedRecipes(state.pantry);
    await persistAll();
  }
  render();
}

/* ============================== HELPERS ============================== */
function findRecipe(id){ return state.recipes.find(r=>r.id===id); }
function findPantry(id){ return state.pantry.find(p=>p.id===id); }
function findPackaging(id){ return state.packaging.find(p=>p.id===id); }
function baht(n){ n = Number(n)||0; return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' บาท'; }
function num2(n){ n=Number(n)||0; return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================== SHARE CODE: CODEC ============================== */
/* ===== SHARE-CODE-CODEC:START ===== */
// Minimal LZW dictionary compressor over UTF-16 code units, plus varint byte
// packing and URL-safe base64. Not a port of any library — same well-known
// idea (back-reference repeated substrings via a growing dictionary), written
// fresh so share codes stay short without adding an external dependency.
// Iterating by code unit (not by Unicode code point) means every symbol that
// can appear — including each half of a surrogate pair — is guaranteed to
// already be seeded in the dictionary, so there's no "unseen first symbol"
// edge case to special-case.

function lzwCompress(str){
  const dict = new Map();
  for(let i=0;i<65536;i++) dict.set(String.fromCharCode(i), i);
  let nextCode = 65536;
  let w = '';
  const codes = [];
  for(let i=0;i<str.length;i++){
    const ch = str[i];
    const wc = w + ch;
    if(dict.has(wc)){
      w = wc;
    } else {
      codes.push(dict.get(w));
      dict.set(wc, nextCode++);
      w = ch;
    }
  }
  if(w !== '') codes.push(dict.get(w));
  return codes;
}

function lzwDecompress(codes){
  if(codes.length === 0) return '';
  const dict = new Map();
  for(let i=0;i<65536;i++) dict.set(i, String.fromCharCode(i));
  let nextCode = 65536;
  let w = dict.get(codes[0]);
  let result = w;
  for(let i=1;i<codes.length;i++){
    const k = codes[i];
    let entry;
    if(dict.has(k)) entry = dict.get(k);
    else if(k === nextCode) entry = w + w[0];
    else throw new Error('corrupt LZW stream');
    result += entry;
    dict.set(nextCode++, w + entry[0]);
    w = entry;
  }
  return result;
}

// Plain-arithmetic (no bitwise ops) LEB128-style varint, so there's no 32-bit
// overflow risk even if a very large bundle pushes dictionary codes high.
function varintEncode(codes){
  const bytes = [];
  for(const code of codes){
    let n = code;
    while(true){
      const b = n % 128;
      n = Math.floor(n / 128);
      if(n !== 0){ bytes.push(b | 0x80); } else { bytes.push(b); break; }
    }
  }
  return bytes;
}
function varintDecode(bytes){
  const codes = [];
  let n = 0, mult = 1;
  for(const b of bytes){
    n += (b & 0x7f) * mult;
    if(b & 0x80){ mult *= 128; } else { codes.push(n); n = 0; mult = 1; }
  }
  return codes;
}

const B64URL_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function bytesToBase64Url(bytes){
  let out = '';
  for(let i=0;i<bytes.length;i+=3){
    const b0=bytes[i], b1=bytes[i+1], b2=bytes[i+2];
    const has1 = i+1<bytes.length, has2 = i+2<bytes.length;
    out += B64URL_CHARS[b0>>2];
    out += B64URL_CHARS[((b0&3)<<4) | (has1? b1>>4 : 0)];
    if(has1) out += B64URL_CHARS[((b1&15)<<2) | (has2? b2>>6 : 0)];
    if(has2) out += B64URL_CHARS[b2&63];
  }
  return out;
}
function base64UrlToBytes(s){
  const rev = {};
  for(let i=0;i<B64URL_CHARS.length;i++) rev[B64URL_CHARS[i]] = i;
  const bytes = [];
  let buffer = 0, bits = 0;
  for(const ch of s){
    if(!(ch in rev)) throw new Error('invalid base64url character');
    buffer = (buffer << 6) | rev[ch];
    bits += 6;
    if(bits >= 8){
      bits -= 8;
      bytes.push((buffer >> bits) & 0xff);
    }
  }
  return bytes;
}

function compressString(str){
  return bytesToBase64Url(varintEncode(lzwCompress(str)));
}
function decompressString(code){
  return lzwDecompress(varintDecode(base64UrlToBytes(code)));
}
/* ===== SHARE-CODE-CODEC:END ===== */

/* ===== SHARE-CODE-ENVELOPE:START ===== */
const SHARE_CODE_PREFIX = 'FCC1:';
const SHARE_CODE_VERSION = 2;

// Binary wire format (v2) — replaces plain JSON for the payload bytes.
// JSON's quotes/commas/brackets/field-names cost more than the actual
// recipe data for a typical share (a near-empty recipe was 284 bytes of
// JSON for ~45 bytes of real Thai text). Every field is packed instead as:
// varint counts/enums, length-prefixed UTF-8 strings, and fixed-point
// (×100, i.e. satang) varints for money/percent/quantity fields — the same
// 2-decimal precision the app already displays everywhere via .toFixed(2),
// so this loses no precision a user could actually see. `category` is
// stored as an index into RECIPE_CATS (always one of 4 known values from
// the editor's own dropdown) rather than repeating the Thai text.
function writeVarint(out, n){
  out.push(...varintEncode([Math.max(0, Math.round(Number(n)||0))]));
}
function writeFixed(out, n){
  writeVarint(out, Math.round((Number(n)||0)*100));
}
function writeString(out, s){
  const strBytes = Array.from(new TextEncoder().encode(String(s==null?'':s)));
  writeVarint(out, strBytes.length);
  for(const b of strBytes) out.push(b);
}
function readVarint(r){
  let n=0, mult=1, b;
  do{
    if(r.pos >= r.bytes.length) throw new Error('unexpected end of data');
    b = r.bytes[r.pos++];
    n += (b & 0x7f) * mult;
    mult *= 128;
  } while(b & 0x80);
  return n;
}
function readFixed(r){ return readVarint(r)/100; }
function readString(r){
  const len = readVarint(r);
  if(r.pos+len > r.bytes.length) throw new Error('unexpected end of data');
  const strBytes = r.bytes.slice(r.pos, r.pos+len);
  r.pos += len;
  return new TextDecoder().decode(new Uint8Array(strBytes));
}

function packSharePayload(payload){
  const out = [];
  writeVarint(out, payload.v);
  writeVarint(out, payload.packaging.length);
  const keyToIndex = {};
  payload.packaging.forEach((p,i)=>{
    keyToIndex[p.key] = i;
    writeString(out, p.name);
    writeFixed(out, p.unitCost);
  });
  writeVarint(out, payload.recipes.length);
  payload.recipes.forEach(r=>{
    writeString(out, r.name);
    writeVarint(out, Math.max(0, RECIPE_CATS.indexOf(r.category)));
    writeFixed(out, r.yieldQty);
    writeString(out, r.yieldUnit);
    writeFixed(out, r.laborRate);
    writeFixed(out, r.laborHours);
    writeFixed(out, r.gasPct);
    writeFixed(out, r.deliveryCost);
    writeFixed(out, r.overheadPct);
    writeFixed(out, r.targetPct);
    const pkgIdx = (r.packagingKey!=null && r.packagingKey in keyToIndex) ? keyToIndex[r.packagingKey]+1 : 0;
    writeVarint(out, pkgIdx);
    writeVarint(out, r.ingredients.length);
    r.ingredients.forEach(ing=>{
      writeString(out, ing.name);
      writeFixed(out, ing.qty);
      writeString(out, ing.unit);
      writeFixed(out, ing.unitCost);
    });
  });
  return out;
}

function unpackSharePayload(bytes){
  const r = {bytes, pos:0};
  const v = readVarint(r);
  const packagingCount = readVarint(r);
  const packaging = [];
  for(let i=0;i<packagingCount;i++){
    const name = readString(r);
    const unitCost = readFixed(r);
    packaging.push({key:'pk'+i, name, unitCost});
  }
  const recipeCount = readVarint(r);
  if(recipeCount===0) throw new Error('empty recipes');
  const recipes = [];
  for(let i=0;i<recipeCount;i++){
    const name = readString(r);
    const category = RECIPE_CATS[readVarint(r)] || RECIPE_CATS[0];
    const yieldQty = readFixed(r);
    const yieldUnit = readString(r);
    const laborRate = readFixed(r);
    const laborHours = readFixed(r);
    const gasPct = readFixed(r);
    const deliveryCost = readFixed(r);
    const overheadPct = readFixed(r);
    const targetPct = readFixed(r);
    const pkgIdx = readVarint(r);
    const packagingKey = pkgIdx>0 ? 'pk'+(pkgIdx-1) : null;
    const ingCount = readVarint(r);
    const ingredients = [];
    for(let j=0;j<ingCount;j++){
      const iname = readString(r);
      const qty = readFixed(r);
      const unit = readString(r);
      const unitCost = readFixed(r);
      ingredients.push({name:iname, qty, unit, unitCost});
    }
    recipes.push({name,category,yieldQty,yieldUnit,laborRate,laborHours,gasPct,deliveryCost,overheadPct,targetPct,packagingKey,ingredients});
  }
  return {v, type:'recipe-bundle', packaging, recipes};
}

function bytesToBinaryString(bytes){
  let s = '';
  for(const b of bytes) s += String.fromCharCode(b);
  return s;
}
function binaryStringToBytes(s){
  const bytes = [];
  for(let i=0;i<s.length;i++) bytes.push(s.charCodeAt(i));
  return bytes;
}

function encodeShareCode(payload){
  const bytes = packSharePayload(payload);
  // LZW only pays off once there's real repeated content (multiple
  // ingredients/recipes sharing names). For a small/near-empty payload its
  // dictionary codes (3+ varint bytes each once they exceed the pre-seeded
  // 65536-entry BMP alphabet) can cost more than the literal bytes they
  // replace. Compute both and keep whichever is shorter.
  const compressed = compressString(bytesToBinaryString(bytes));
  const plain = bytesToBase64Url(bytes);
  return compressed.length <= plain.length
    ? SHARE_CODE_PREFIX + 'L' + compressed
    : SHARE_CODE_PREFIX + 'P' + plain;
}

function decodeShareCode(code){
  const trimmed = String(code||'').trim();
  if(!trimmed.startsWith(SHARE_CODE_PREFIX)){
    return {ok:false, error:'ไม่ใช่โค้ดสูตรอาหารที่ถูกต้อง'};
  }
  const rest = trimmed.slice(SHARE_CODE_PREFIX.length);
  const marker = rest[0];
  const body = rest.slice(1);
  let payload;
  try{
    const bytes = marker==='L' ? binaryStringToBytes(decompressString(body))
      : marker==='P' ? base64UrlToBytes(body)
      : (()=>{ throw new Error('unknown encoding marker'); })();
    payload = unpackSharePayload(bytes);
  }catch(e){
    return {ok:false, error:'โค้ดไม่ถูกต้องหรือเสียหาย'};
  }
  if(!payload || payload.type!=='recipe-bundle' || !Array.isArray(payload.recipes) || !payload.recipes.length){
    return {ok:false, error:'โค้ดไม่ถูกต้องหรือเสียหาย'};
  }
  if(typeof payload.v!=='number' || payload.v > SHARE_CODE_VERSION){
    return {ok:false, error:'โค้ดนี้สร้างจากแอปเวอร์ชันใหม่กว่า กรุณาอัปเดตแอป'};
  }
  return {ok:true, payload};
}
/* ===== SHARE-CODE-ENVELOPE:END ===== */

/* ============================== SHARE CODE: BUILD PAYLOAD ============================== */
function buildSharePayload(recipeIds){
  const packagingMap = new Map(); // dedupe key -> {key, name, unitCost}
  let pkCounter = 0;

  function packagingKeyFor(r){
    if(r.packagingId){
      const pkg = findPackaging(r.packagingId);
      if(!pkg) return null;
      const dedupeKey = 'id:'+r.packagingId;
      if(!packagingMap.has(dedupeKey)){
        packagingMap.set(dedupeKey, {key:'pk'+(pkCounter++), name:pkg.name, unitCost:packagingUnitCost(pkg)});
      }
      return packagingMap.get(dedupeKey).key;
    }
    if(r.unlinkedPackaging){
      // dedupe by value too, so re-sharing an already-imported (still
      // unmapped) recipe alongside others using the same packaging doesn't
      // duplicate the packaging entry in the outgoing payload
      const dedupeKey = 'name:'+r.unlinkedPackaging.name+'|cost:'+r.unlinkedPackaging.unitCost;
      if(!packagingMap.has(dedupeKey)){
        packagingMap.set(dedupeKey, {key:'pk'+(pkCounter++), name:r.unlinkedPackaging.name, unitCost:r.unlinkedPackaging.unitCost});
      }
      return packagingMap.get(dedupeKey).key;
    }
    return null;
  }

  const recipes = recipeIds.map(id=>{
    const r = findRecipe(id);
    return {
      name: r.name,
      category: r.category,
      yieldQty: Number(r.yieldQty)||0,
      yieldUnit: r.yieldUnit,
      laborRate: Number(r.laborRate)||0,
      laborHours: Number(r.laborHours)||0,
      gasPct: Number(r.gasPct)||0,
      deliveryCost: Number(r.deliveryCost)||0,
      overheadPct: Number(r.overheadPct)||0,
      targetPct: Number(r.targetPct)||0,
      packagingKey: packagingKeyFor(r),
      ingredients: r.ingredients.map(ing=>({
        name: ingName(ing),
        qty: Number(ing.qty)||0,
        unit: ingUnitLabel(ing),
        unitCost: ingUnitCost(ing),
      })),
    };
  });

  return {
    v: SHARE_CODE_VERSION,
    type: 'recipe-bundle',
    packaging: Array.from(packagingMap.values()),
    recipes,
  };
}

/* ============================== SHARE CODE: APPLY IMPORTED BUNDLE ============================== */
function applyImportedBundle(payload){
  const packagingByKey = {};
  (payload.packaging||[]).forEach(p=>{ packagingByKey[p.key] = p; });

  const newRecipes = payload.recipes.map(rp=>{
    const pkgSnapshot = rp.packagingKey ? packagingByKey[rp.packagingKey] : null;
    return {
      id: uid('r'),
      name: String(rp.name || 'สูตรนำเข้า'),
      category: RECIPE_CATS.includes(rp.category) ? rp.category : RECIPE_CATS[0],
      yieldQty: Number(rp.yieldQty)||0,
      yieldUnit: String(rp.yieldUnit || 'ชิ้น'),
      ingredients: (rp.ingredients||[]).map(ing=>({
        id: uid('i'),
        mode: 'unlinked',
        name: String(ing.name || '(ไม่มีชื่อ)'),
        qty: Number(ing.qty)||0,
        unit: String(ing.unit || 'หน่วย'),
        unitCost: Number(ing.unitCost)||0,
      })),
      packagingId: '',
      unlinkedPackaging: pkgSnapshot ? {name:pkgSnapshot.name, unitCost:Number(pkgSnapshot.unitCost)||0} : null,
      laborRate: Number(rp.laborRate)||0,
      laborHours: Number(rp.laborHours)||0,
      gasPct: Number(rp.gasPct)||0,
      deliveryCost: Number(rp.deliveryCost)||0,
      overheadPct: Number(rp.overheadPct)||0,
      targetPct: Number(rp.targetPct)||0,
      sellPrice: 0,
      note: '',
    };
  });

  state.recipes = [...newRecipes, ...state.recipes];
  return newRecipes;
}

function pantryUnitCost(p){
  const f = UNIT_FACTOR[p.buyUnit] || 1;
  const denom = (Number(p.buyQty)||0) * f;
  return denom>0 ? (Number(p.buyPrice)||0)/denom : 0;
}
function pantryBaseLabel(p){ return FAMILY_BASE[p.family] || ''; }

/* cost per piece — a box's price spread over the pieces it contains */
function packagingUnitCost(p){
  const piecesPerBox = Number(p.piecesPerBox)||1;
  const qty = Number(p.buyQty)||0;
  const pieces = p.buyUnit==='กล่อง' ? qty*piecesPerBox : qty;
  return pieces>0 ? (Number(p.buyPrice)||0)/pieces : 0;
}
function packagingBoxCost(p){ return packagingUnitCost(p) * (Number(p.piecesPerBox)||1); }

function ingUnitCost(ing){
  if(ing.mode==='pantry'){ const p=findPantry(ing.pantryId); return p? pantryUnitCost(p):0; }
  return Number(ing.unitCost)||0;
}
function ingUnitLabel(ing){
  if(ing.mode==='pantry'){ const p=findPantry(ing.pantryId); return p? pantryBaseLabel(p):''; }
  return ing.unit || 'หน่วย';
}
function ingName(ing){
  if(ing.mode==='pantry'){ const p=findPantry(ing.pantryId); return p? p.name : '(ถูกลบจากคลัง)'; }
  return ing.name || '(ไม่มีชื่อ)';
}
function ingCost(ing){ return (Number(ing.qty)||0) * ingUnitCost(ing); }

function calcRecipe(r){
  const mat = r.ingredients.reduce((s,i)=>s+ingCost(i),0);
  const yieldQty = Number(r.yieldQty)||0;
  const pkg = r.packagingId ? findPackaging(r.packagingId) : null;
  const packUnitCost = pkg ? packagingUnitCost(pkg) : (r.unlinkedPackaging ? Number(r.unlinkedPackaging.unitCost)||0 : 0);
  const pack = packUnitCost * yieldQty;
  const costBasic = mat+pack;
  const perPieceBasic = yieldQty? costBasic/yieldQty : 0;
  const labor = (Number(r.laborRate)||0)*(Number(r.laborHours)||0);
  const overhead = costBasic*((Number(r.overheadPct)||0)/100);
  const gas = costBasic*((Number(r.gasPct)||0)/100);
  const fullCost = costBasic+labor+gas+overhead+(Number(r.deliveryCost)||0);
  const perPieceFull = yieldQty? fullCost/yieldQty : 0;
  const suggestRaw = perPieceFull*(1+(Number(r.targetPct)||0)/100);
  const suggest = Math.ceil(suggestRaw*2)/2;
  const sellPrice = Number(r.sellPrice)||0;
  const revenue = sellPrice*yieldQty;
  const profit = revenue-fullCost;
  const margin = revenue>0? profit/revenue*100 : 0;
  const profitBasic = revenue-costBasic;
  const marginBasic = revenue>0? profitBasic/revenue*100 : 0;
  // comparison candidates around the full per-piece cost
  const step = perPieceFull<20?1:(perPieceFull<100?5:10);
  const start = Math.max(step, Math.ceil((perPieceFull*0.9)/step)*step);
  const candidates = [0,1,2,3,4].map(i=>start+i*step);
  const target = (Number(r.targetPct)||0)/100 / (1+(Number(r.targetPct)||0)/100);
  const compare = candidates.map(p=>{
    const rev=p*yieldQty, pf=rev-fullCost, pctOfRev = rev>0? pf/rev*100 : 0;
    let status = pf<=0 ? 'ขาดทุน' : (pctOfRev/100>=target ? 'ถึงเป้า' : 'ต่ำกว่าเป้า');
    return {price:p, profit:pf, pct:pctOfRev, status};
  });
  return {mat,pack,costBasic,perPieceBasic,labor,overhead,gas,fullCost,perPieceFull,suggestRaw,suggest,
    revenue,profit,margin,profitBasic,marginBasic,compare,yieldQty};
}

function recipeNeedsMapping(r){
  return r.ingredients.some(i => i.mode !== 'pantry') || !!r.unlinkedPackaging;
}

function duplicateRecipe(id){
  const r = findRecipe(id); if(!r) return;
  const copy = JSON.parse(JSON.stringify(r));
  copy.id = uid('r'); copy.name = r.name+' (สำเนา)';
  copy.ingredients.forEach(i=> i.id = uid('i'));
  const idx = state.recipes.findIndex(x=>x.id===id);
  state.recipes.splice(idx+1,0,copy);
  render();
  schedulePersist();
}
function deleteRecipe(id){
  if(!confirm('ลบสูตรนี้ทิ้งเลยไหม?')) return;
  state.recipes = state.recipes.filter(r=>r.id!==id);
  if(ui.recipeId===id) ui.recipeId=null;
  render();
  schedulePersist();
}

function fallbackCopy(ta, showStatus){
  ta.focus();
  ta.select();
  try{
    const ok = document.execCommand('copy');
    showStatus(ok ? 'คัดลอกแล้ว' : 'แตะเพื่อเลือกแล้วคัดลอกเอง (Ctrl/Cmd+C)');
  }catch(e){
    showStatus('แตะเพื่อเลือกแล้วคัดลอกเอง (Ctrl/Cmd+C)');
  }
}
function copyShareCode(){
  const ta = document.getElementById('shareCodeText');
  const status = document.getElementById('shareCopyStatus');
  const showStatus = (msg)=>{ if(status) status.textContent = msg; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(()=>showStatus('คัดลอกแล้ว')).catch(()=>fallbackCopy(ta, showStatus));
  } else {
    fallbackCopy(ta, showStatus);
  }
}

function submitImport(){
  const code = document.getElementById('importCodeText').value;
  const result = decodeShareCode(code);
  if(!result.ok){
    ui.importError = result.error;
    render();
    return;
  }
  let imported;
  try{
    imported = applyImportedBundle(result.payload);
  }catch(e){
    ui.importError = 'โค้ดไม่ถูกต้องหรือเสียหาย';
    render();
    return;
  }
  ui.showImportModal = false;
  ui.importError = '';
  ui.importText = '';
  ui.recipeId = null;
  render();
  schedulePersist();
  const anyUnmapped = imported.some(recipeNeedsMapping);
  alert('นำเข้าสำเร็จ '+imported.length+' สูตร'+(anyUnmapped ? ' — บางสูตรต้องเชื่อมวัตถุดิบ/บรรจุภัณฑ์กับคลังของคุณ' : ''));
}

function unmappedBannerInner(r){
  if(!recipeNeedsMapping(r)) return '';
  const items = r.ingredients.filter(i=>i.mode!=='pantry').map(i=>i.name);
  if(r.unlinkedPackaging) items.push(r.unlinkedPackaging.name+' (บรรจุภัณฑ์)');
  return `<div class="warn" style="margin-bottom:16px">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#b2622d" stroke-width="2.75" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M12 11v5"></path></svg>
    <div>สูตรนี้นำเข้ามาจากที่อื่น ยังไม่ได้เชื่อมกับคลังของคุณ: ${items.map(esc).join(', ')} — เลือกจากคลังหรือกด "+ เพิ่มเข้าคลัง" ที่แถวนั้นๆ</div>
  </div>`;
}
function refreshUnmappedBanner(rid){
  const r = findRecipe(rid);
  const el = document.getElementById('unmappedBanner_'+rid);
  if(r && el) el.innerHTML = unmappedBannerInner(r);
}
function mapIngredientToPantry(rid, idx, pantryId){
  const r = findRecipe(rid);
  const ing = r.ingredients[idx];
  ing.mode = 'pantry';
  ing.pantryId = pantryId;
  delete ing.name; delete ing.unit; delete ing.unitCost;
  const rowEl = document.getElementById('ingrow_'+rid+'_'+idx);
  if(rowEl) rowEl.outerHTML = ingRowHTML(r, idx);
  refreshCalcPanel(rid);
  refreshUnmappedBanner(rid);
  schedulePersist();
}
function guessPantryFamilyFromUnit(unit){
  if(unit==='กรัม'||unit==='กก.') return 'mass';
  if(unit==='มล.'||unit==='ลิตร') return 'volume';
  if(unit==='ฟอง') return 'egg';
  return 'piece';
}
function addUnlinkedIngredientToPantry(rid, idx){
  const r = findRecipe(rid);
  const ing = r.ingredients[idx];
  const family = guessPantryFamilyFromUnit(ing.unit);
  const buyUnit = FAMILY_UNITS[family].includes(ing.unit) ? ing.unit : FAMILY_UNITS[family][0];
  const newPantryItem = { id: uid('p'), name: ing.name, category: PANTRY_CATS[0], family, buyPrice: Number(ing.unitCost)||0, buyQty: 1, buyUnit };
  state.pantry.push(newPantryItem);
  mapIngredientToPantry(rid, idx, newPantryItem.id);
}
function packagingFieldHTML(r){
  const isUnlinked = !!r.unlinkedPackaging;
  return `<div class="field" id="packagingField_${r.id}"><label>บรรจุภัณฑ์ที่ใช้</label>
    <select class="input" onchange="mapPackagingToWarehouse('${r.id}',this.value)">
      ${isUnlinked
        ? `<option value="" selected disabled>🟡 (นำเข้า) ${esc(r.unlinkedPackaging.name)} — ${num2(r.unlinkedPackaging.unitCost)} บาท/ชิ้น</option><option value="">— ไม่ใช้บรรจุภัณฑ์ —</option>`
        : `<option value="" ${!r.packagingId?'selected':''}>— ไม่ใช้บรรจุภัณฑ์ —</option>`}
      ${state.packaging.map(p=>`<option value="${p.id}" ${!isUnlinked && p.id===r.packagingId?'selected':''}>${esc(p.name)} (${packagingUnitCost(p).toFixed(2)} บาท/ชิ้น)</option>`).join('')}
    </select>
    ${isUnlinked ? `<button class="btn btn-ghost btn-sm" style="align-self:flex-start;padding:2px 4px;font-size:11px" onclick="addUnlinkedPackagingToWarehouse('${r.id}')">+ เพิ่มเข้าคลังบรรจุภัณฑ์</button>` : ''}
  </div>`;
}
function mapPackagingToWarehouse(rid, packagingId){
  const r = findRecipe(rid);
  r.packagingId = packagingId;
  r.unlinkedPackaging = null;
  document.getElementById('packagingField_'+rid).outerHTML = packagingFieldHTML(r);
  refreshCalcPanel(rid);
  refreshUnmappedBanner(rid);
  schedulePersist();
}
function addUnlinkedPackagingToWarehouse(rid){
  const r = findRecipe(rid);
  const snap = r.unlinkedPackaging;
  const newItem = { id: uid('pk'), name: snap.name, buyPrice: Number(snap.unitCost)||0, buyQty: 1, buyUnit: 'ชิ้น', piecesPerBox: 1 };
  state.packaging.push(newItem);
  mapPackagingToWarehouse(rid, newItem.id);
}
function ingTableInner(r){
  if(!r.ingredients.length){
    return state.pantry.length
      ? `<div class="muted" style="font-size:13px;padding:10px 0">ยังไม่มีวัตถุดิบ — กด "+ เพิ่มวัตถุดิบ" ด้านบน</div>`
      : `<div class="muted" style="font-size:13px;padding:10px 0">ยังไม่มีวัตถุดิบในคลัง — กด "+ เพิ่มวัตถุดิบ" เพื่อไปเพิ่มวัตถุดิบในคลังก่อน</div>`;
  }
  return r.ingredients.map((ing,idx)=>ingRowHTML(r,idx)).join('');
}
function ingRowHTML(r, idx){
  const ing = r.ingredients[idx];
  const cost = ingCost(ing);
  const isUnlinked = ing.mode === 'unlinked';
  return `<div class="ing-row" id="ingrow_${r.id}_${idx}">
    <div>
      <select class="input" onchange="mapIngredientToPantry('${r.id}',${idx},this.value)">
        ${isUnlinked ? `<option value="" selected disabled>🟡 (นำเข้า) ${esc(ing.name)} — ${num2(ing.unitCost)} บาท/${esc(ing.unit)}</option>` : ''}
        ${state.pantry.map(p=>`<option value="${p.id}" ${!isUnlinked && p.id===ing.pantryId?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
      ${isUnlinked ? `<button class="btn btn-ghost btn-sm" style="padding:2px 4px;font-size:11px" onclick="addUnlinkedIngredientToPantry('${r.id}',${idx})">+ เพิ่มเข้าคลัง</button>` : ''}
    </div>
    <input class="input" type="number" min="0" step="1" value="${ing.qty??''}" placeholder="ปริมาณ"
      oninput="updIngField('${r.id}',${idx},'qty',this.value)" />
    <div class="muted" style="font-size:12px">${esc(ingUnitLabel(ing))}</div>
    <div class="num" id="ingcost_${r.id}_${idx}" style="font-size:14px">${num2(cost)}</div>
    <button class="btn btn-ghost btn-sm" onclick="removeIngredient('${r.id}',${idx})" title="ลบ">✕</button>
  </div>`;
}

function addIngredient(rid){
  const r = findRecipe(rid);
  if(!state.pantry.length){
    if(confirm('ยังไม่มีวัตถุดิบในคลังวัตถุดิบ ต้องการไปเพิ่มวัตถุดิบตอนนี้เลยไหม?')){
      ui.tab = 'pantry';
      ui.pantryAdding = true;
      ui.pantryEditing = null;
      render();
    }
    return;
  }
  const first = state.pantry[0];
  r.ingredients.push({id:uid('i'), mode:'pantry', pantryId: first? first.id : null, qty:0});
  document.getElementById('ingTable_'+rid).innerHTML = ingTableInner(r);
  refreshCalcPanel(rid);
  schedulePersist();
}
function removeIngredient(rid, idx){
  const r = findRecipe(rid);
  r.ingredients.splice(idx,1);
  document.getElementById('ingTable_'+rid).innerHTML = ingTableInner(r);
  refreshCalcPanel(rid);
  schedulePersist();
}
function updIngField(rid, idx, field, value){
  const r = findRecipe(rid);
  const ing = r.ingredients[idx];
  ing[field] = (field==='qty'||field==='unitCost') ? value : value;
  const costEl = document.getElementById('ingcost_'+rid+'_'+idx);
  if(costEl) costEl.textContent = num2(ingCost(ing));
  refreshCalcPanel(rid);
  schedulePersist();
}

function updRecipeField(id, field, value){
  const r = findRecipe(id);
  r[field] = value;
  // targetPct/sellPrice are typed inside the calc panel itself — replacing the
  // panel's innerHTML on every keystroke would destroy the very input being
  // typed into, which drops focus and closes the on-screen keyboard on mobile.
  // Patch just the computed numbers instead and leave both inputs untouched.
  if(field==='targetPct' || field==='sellPrice') updateCalcOutputs(id);
  else refreshCalcPanel(id);
  schedulePersist();
}

function refreshCalcPanel(id){
  const r = findRecipe(id);
  const panel = document.getElementById('calcPanel_'+id);
  if(!r || !panel) return;
  panel.innerHTML = calcPanelInner(r);
}

function updateCalcOutputs(id){
  const r = findRecipe(id);
  if(!r) return;
  const c = calcRecipe(r);
  const setText = (elId, val) => { const el=document.getElementById(elId); if(el) el.textContent = val; };
  setText('cp_mat_'+id, baht(c.mat));
  setText('cp_pack_'+id, baht(c.pack));
  setText('cp_labor_'+id, baht(c.labor));
  setText('cp_gas_'+id, baht(c.gas));
  setText('cp_overhead_'+id, baht(c.overhead));
  setText('cp_delivery_'+id, baht(Number(r.deliveryCost)||0));
  setText('cp_perpiece_'+id, num2(c.perPieceFull));
  setText('cp_fullcost_'+id, num2(c.fullCost));
  setText('cp_suggest_'+id, num2(c.suggest));
  setText('cp_revenue_'+id, num2(c.revenue));
  setText('cp_profit_'+id, num2(c.profit));
  setText('cp_margin_'+id, `กำไร ${c.margin.toFixed(0)}% ของยอดขาย`);

  const targetInput = document.getElementById('cp_targetInput_'+id);
  if(targetInput && document.activeElement!==targetInput) targetInput.value = r.targetPct;
  const sellInput = document.getElementById('cp_sellInput_'+id);
  if(sellInput && document.activeElement!==sellInput) sellInput.value = r.sellPrice;

  const chipsEl = document.getElementById('cp_chips_'+id);
  if(chipsEl) chipsEl.innerHTML = pctChipsHTML(r);

  const warnEl = document.getElementById('cp_warn_'+id);
  if(warnEl) warnEl.innerHTML = warnBoxHTML(c);

  const compareEl = document.getElementById('cp_compare_'+id);
  if(compareEl) compareEl.innerHTML = compareRowsHTML(c);
}

function pctChipsHTML(r){
  return [20,30,40,50,60].map(p=>`<button class="chip ${Number(r.targetPct)===p?'active':''}" onclick="setPct('${r.id}',${p})">${p}%</button>`).join('');
}
function warnBoxHTML(c){
  if(c.profit>=0) return '';
  return `<div class="warn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#b2622d" stroke-width="2.75" stroke-linecap="round"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg>
  <div>ราคาขายต่ำกว่าต้นทุน — ขาดทุน ${num2(Math.abs(c.profit))} บาท/สูตร แนะนำขายที่ ${num2(c.suggest)} บาท</div></div>`;
}
function compareRowsHTML(c){
  return c.compare.map(row=>`
      <div class="compare-row">
        <div class="p"><span class="num" style="font-size:15px">${row.price}</span>
          <span class="tag ${row.status==='ถึงเป้า'?'tag-accent-2':(row.status==='ขาดทุน'?'tag-danger':'tag-neutral')}" style="font-size:10px">${row.status}</span></div>
        <div style="width:88px;text-align:right;font-size:12.5px;font-weight:600">${num2(row.profit)}</div>
        <div style="width:44px;text-align:right;font-size:12px;color:var(--color-accent-700)">${row.pct.toFixed(0)}%</div>
      </div>`).join('');
}

function setPct(id, pct){ updRecipeField(id,'targetPct',pct); }

/* ============================== PANTRY ============================== */
function pantryHTML(){
  const q = ui.pantrySearch.trim().toLowerCase();
  const filtered = state.pantry.filter(p=> !q || p.name.toLowerCase().includes(q));
  const byCat = {};
  filtered.forEach(p=>{ (byCat[p.category]=byCat[p.category]||[]).push(p); });

  let rows = '';
  if(ui.pantryAdding){ rows += pantryEditPanel(null); }
  Object.keys(byCat).forEach(cat=>{
    rows += `<div class="pantry-cat">${esc(cat)}</div>`;
    byCat[cat].forEach(p=>{
      if(ui.pantryEditing===p.id){ rows += pantryEditPanel(p.id); }
      else { rows += pantryRowView(p); }
    });
  });
  if(!filtered.length && !ui.pantryAdding) rows += `<div class="muted" style="padding:20px 0">ไม่พบวัตถุดิบที่ค้นหา</div>`;

  return `
  <div class="toolbar">
    <input class="input" placeholder="ค้นหา เช่น เนย, แป้ง" value="${esc(ui.pantrySearch)}"
      oninput="ui.pantrySearch=this.value; renderPantryList()" />
    <span class="tag tag-neutral">ทั้งหมด ${state.pantry.length}</span>
    <button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="ui.pantryAdding=true; ui.pantryEditing=null; render()">+ เพิ่มวัตถุดิบ</button>
  </div>
  <div id="pantryList">${rows}</div>
  `;
}
function renderPantryList(){
  // re-render whole view content only (keep tabs/topbar)
  document.querySelector('main').innerHTML = pantryHTML();
}
function pantryRowView(p){
  const uc = pantryUnitCost(p);
  return `<div class="pantry-row">
    <div><div class="name">${esc(p.name)}</div><div class="meta">${num2(p.buyPrice)} บาท / ${p.buyQty} ${esc(p.buyUnit)}</div></div>
    <div class="cost"><div class="num" style="font-size:15px">${uc.toFixed(2)}</div><div class="meta">บาท/${esc(pantryBaseLabel(p))}</div></div>
    <div></div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-secondary btn-sm" onclick="ui.pantryEditing='${p.id}'; ui.pantryAdding=false; render()">แก้ไข</button>
      <button class="btn btn-danger btn-sm" onclick="deletePantry('${p.id}')">ลบ</button>
    </div>
  </div>`;
}
function pantryEditPanel(id){
  const p = id ? findPantry(id) : {id:null, name:'', category:PANTRY_CATS[0], family:'mass', buyPrice:0, buyQty:0, buyUnit:'กรัม'};

  return `<div class="edit-panel" id="pantryEdit_${draftKey}" data-pid="${id||''}">
    ${pantryEditPanelFields(p, draftKey)}
  </div>`;
}
function pantryEditPanelFields(p, draftKey){
  return `
    <div class="grid g2">
      <div class="field"><label>ชื่อวัตถุดิบ</label>
        <input class="input" id="pf_name_${draftKey}" value="${esc(p.name)}" placeholder="เช่น เนยเค็ม" /></div>
      <div class="field"><label>หมวดหมู่</label>
        <select class="input" id="pf_cat_${draftKey}">${PANTRY_CATS.map(c=>`<option ${c===p.category?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="grid g3">
      <div class="field"><label>ประเภทหน่วย</label>
        <select class="input" id="pf_family_${draftKey}" onchange="refreshPantryUnitChoices('${draftKey}')">
          ${Object.keys(FAMILY_LABEL).map(f=>`<option value="${f}" ${f===p.family?'selected':''}>${FAMILY_LABEL[f]}</option>`).join('')}

/* ============================== QUICK CALC ============================== */
function quickCalcHTML(){
  return `
  <div class="editor-grid">
    <div class="card">
      <h3 style="font-size:16px;margin-bottom:10px">คำนวณเร็ว (ไม่บันทึกเป็นสูตร)</h3>
      <div class="grid g2">
        <div class="field"><label>ต้นทุนวัตถุดิบรวม (บาท)</label>
          <input class="input" type="number" id="q_mat" value="${ui.quick.mat}" oninput="updQuick('mat',this.value)" /></div>
        <div class="field"><label>ค่าบรรจุภัณฑ์รวม (บาท)</label>
          <input class="input" type="number" id="q_pack" value="${ui.quick.pack}" oninput="updQuick('pack',this.value)" /></div>
        <div class="field"><label>ค่าแรงรวม (บาท)</label>
          <input class="input" type="number" id="q_labor" value="${ui.quick.labor}" oninput="updQuick('labor',this.value)" /></div>
        <div class="field"><label>ค่าแก๊ส/ไฟ (บาท)</label>
          <input class="input" type="number" id="q_gas" value="${ui.quick.gas}" oninput="updQuick('gas',this.value)" /></div>
        <div class="field"><label>ค่าส่ง (บาท)</label>
          <input class="input" type="number" id="q_delivery" value="${ui.quick.delivery}" oninput="updQuick('delivery',this.value)" /></div>
        <div class="field"><label>ค่าโสหุ้ย (%)</label>
          <input class="input" type="number" id="q_overhead" value="${ui.quick.overhead}" oninput="updQuick('overhead',this.value)" /></div>
        <div class="field"><label>ทำได้กี่หน่วย</label>
          <input class="input" type="number" id="q_yield" value="${ui.quick.yieldQty}" oninput="updQuick('yieldQty',this.value)" /></div>
        <div class="field"><label>%กำไรที่ต้องการ</label>
          <input class="input" type="number" id="q_target" value="${ui.quick.target}" oninput="updQuick('target',this.value)" /></div>
      </div>
      <div class="field" style="margin-top:12px">
        <label>ราคาที่จะขายจริง (บาท/หน่วย) — ใส่เพื่อดูกำไรจริง</label>
        <input class="input" type="number" id="q_sell" value="${ui.quick.sell}" oninput="updQuick('sell',this.value)" style="max-width:200px" />
      </div>
    </div>
    <div class="card" id="quickResult">${quickResultInner()}</div>
  </div>`;
}
function updQuick(field, value){ ui.quick[field] = value; document.getElementById('quickResult').innerHTML = quickResultInner(); }
function quickResultInner(){
  const q = ui.quick;
  const mat=Number(q.mat)||0, pack=Number(q.pack)||0, labor=Number(q.labor)||0, gas=Number(q.gas)||0,
    delivery=Number(q.delivery)||0, overheadPct=Number(q.overhead)||0, yieldQty=Number(q.yieldQty)||0, target=Number(q.target)||0, sell=Number(q.sell)||0;
  const baseCost = mat+pack;
  const overhead = baseCost*(overheadPct/100);
  const fullCost = baseCost+labor+gas+overhead+delivery;
  const perUnit = yieldQty? fullCost/yieldQty : 0;
  const suggestRaw = perUnit*(1+target/100);
  const suggest = Math.ceil(suggestRaw*2)/2;
  const revenue = sell*yieldQty;
  const profit = revenue-fullCost;
  const margin = revenue>0? profit/revenue*100:0;
  return `
  <h3 style="font-size:16px;margin-bottom:10px">ผลลัพธ์</h3>
  <div class="calc-line"><span>ต้นทุนรวมทั้งสูตร</span><b>${baht(fullCost)}</b></div>
  <hr class="hr">
  <div class="calc-line"><span>ค่าโสหุ้ยที่บวกเข้าไป</span><b>${baht(overhead)}</b></div>
  <div class="result-tiles">
    <div class="tile a"><div class="l">ต้นทุน/หน่วย</div><div class="v num">${num2(perUnit)}</div></div>
    <div class="tile b"><div class="l">ราคาแนะนำ/หน่วย</div><div class="v num">${num2(suggest)}</div></div>
  </div>
  ${sell>0 ? `
  <div class="grid g2">
    <div class="tile" style="background:var(--color-bg)"><div class="l" style="color:rgba(32,30,29,.55)">ขายได้ทั้งหมด</div><div class="v num" style="font-size:17px">${num2(revenue)}</div></div>
    <div class="tile" style="background:var(--color-accent-2-100)"><div class="l" style="color:var(--color-accent-2-800)">กำไรจริง</div><div class="v num" style="font-size:17px;color:var(--color-accent-2-800)">${num2(profit)}</div></div>
  </div>
  <div style="font-size:12px;color:rgba(32,30,29,.7);margin-top:4px">กำไร ${margin.toFixed(0)}% ของยอดขาย</div>
  ` : `<div class="muted" style="font-size:12.5px">กรอกราคาที่จะขายจริงด้านซ้าย เพื่อดูกำไรจริง</div>`}
  `;
}

  state.recipes = [];

/* ============================== IMPORT / EXPORT ============================== */
function exportData(){
  const payload = JSON.stringify({ settings: state.settings, pantry: state.pantry, packaging: state.packaging, recipes: state.recipes, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = 'food-cost-data-'+stamp+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importData(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.pantry || !data.recipes) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
      state.settings = Object.assign(seedSettings(), data.settings||{});
      state.pantry = data.pantry;
      state.packaging = data.packaging || [];
      state.recipes = data.recipes;
      ui.recipeId = null;
      render();
      schedulePersist();
    } catch(err){
      alert('นำเข้าข้อมูลไม่สำเร็จ: '+err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ============================== INIT ============================== */
bootstrap();
