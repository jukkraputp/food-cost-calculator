*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:"Figtree","IBM Plex Sans Thai",system-ui,sans-serif;font-size:14.5px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;letter-spacing:0;margin:0}
button{font-family:inherit}
input,select,textarea{font-family:inherit}

/* ---- components ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;
  font-family:var(--font-display);font-size:13.5px;color:var(--color-text);background:transparent;border:1px solid transparent;
  padding:9px 18px;border-radius:999px;transition:background .12s}
.btn-primary{background:var(--color-accent);color:#fff}
.btn-primary:hover{background:var(--color-accent-600)}
.btn-secondary{border-color:var(--color-divider);background:var(--color-surface-2)}
.btn-secondary:hover{background:var(--color-neutral-200)}
.btn-ghost{color:var(--color-accent);padding:8px 10px}
.btn-ghost:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent)}
.btn-danger{color:var(--color-danger)}
.btn-danger:hover{background:var(--color-danger-bg)}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:11.5px;color:color-mix(in srgb,var(--color-text) 68%,transparent);font-weight:600;letter-spacing:.01em}
.input,select.input{width:100%;min-height:38px;padding:7px 13px;font-size:14px;color:var(--color-text);

.g3{grid-template-columns:1fr 1fr 1fr}

.card{background:var(--color-surface-2);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow-sm)}

/* ---- app shell ---- */
.topbar{position:sticky;top:0;z-index:30;background:#f5ead8;border-bottom:1px solid rgba(0,0,0,.08);

main{max-width:1180px;margin:0 auto;padding:26px 22px 90px}

/* editor */
.editor-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}

.ing-row{display:grid;grid-template-columns:auto 1fr 90px 90px 90px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--color-divider)}

.result-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}

.pctchips{display:flex;gap:6px;flex-wrap:wrap}

  background:transparent;cursor:pointer}

.compare-row{display:flex;align-items:center;gap:8px;background:var(--color-bg);border-radius:14px;padding:9px 12px}
.compare-row .p{flex:1;display:flex;align-items:baseline;gap:8px}

  color:var(--color-accent-800);display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.warn svg{flex:none;margin-top:1px}

/* pantry */
.pantry-row{display:grid;grid-template-columns:1fr 130px 90px auto;gap:10px;align-items:center;
  background:var(--color-surface-2);border-radius:16px;padding:11px 15px;margin-bottom:8px}
@media (max-width:700px){.pantry-row{grid-template-columns:1fr;gap:6px}}
.pantry-row .name{font-weight:600;font-size:14px}
.pantry-row .meta{font-size:11.5px;color:rgba(32,30,29,.55);margin-top:2px}
.pantry-row .cost{text-align:right}
.pantry-cat{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(32,30,29,.45);margin:16px 0 8px}
.edit-panel{background:var(--color-accent-100);border-radius:20px;padding:16px 18px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}

/* settings */
.settings-block{margin-bottom:26px}
.settings-block h3{font-size:16px;margin-bottom:12px}

footer.appfoot{max-width:1180px;margin:0 auto;padding:10px 22px 50px;font-size:11.5px;color:rgba(32,30,29,.45)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================== STATE ============================== */
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }

const FAMILY_LABEL = { mass:'กรัม/กก.', volume:'มล./ลิตร', egg:'ฟอง', piece:'ชิ้น' };
const FAMILY_BASE = { mass:'กรัม', volume:'มล.', egg:'ฟอง', piece:'ชิ้น' };
const FAMILY_UNITS = { mass:['กรัม','กก.'], volume:['มล.','ลิตร'], egg:['ฟอง'], piece:['ชิ้น'] };
const UNIT_FACTOR = { 'กรัม':1,'กก.':1000,'มล.':1,'ลิตร':1000,'ฟอง':1,'ชิ้น':1 };
const PANTRY_CATS = ['ของแห้ง/เบเกอรี่','ของสด','นม/ของเหลว','เครื่องปรุง','บรรจุภัณฑ์','อื่นๆ'];
const RECIPE_CATS = ['ขนม','อาหาร','เครื่องดื่ม','อื่นๆ'];

function seedPantry(){
  return [];
}

function seedRecipes(pantry){
  return [];
}

function seedSettings(){
  return { shopName:'ครัวของหนู', defaultPackaging:1.35, defaultLabor:60, defaultOverhead:20, defaultTarget:40 };
}

/* ============================== DATA CLIENT ==============================
   All persistence goes through this object. Every method returns a Promise
   and is commented with the REST endpoint it stands in for, so swapping the
   backing store later means rewriting only the bodies in this block (e.g.
   replace localStorage calls with fetch() calls to your API) — nothing
   elsewhere in the app needs to change.
============================================================================ */
const STORAGE_PREFIX = 'foodCostCalculator:v1:';

function localGet(key, fallback){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+key);
    return raw==null ? fallback : JSON.parse(raw);
  }catch(e){ return fallback; }
}
function localSet(key, value){ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(value)); }
function localRemove(key){ localStorage.removeItem(STORAGE_PREFIX+key); }

const api = {
  // GET /settings
  async getSettings(){ return localGet('settings', null); },
  // PUT /settings
  async saveSettings(settings){ localSet('settings', settings); return settings; },

  // GET /pantry
  async listPantry(){ return localGet('pantry', null); },
  // PUT /pantry  (bulk replace — simplest mapping for a client-held array;
  // a real API could instead expose POST/PATCH/DELETE per item)
  async savePantry(pantry){ localSet('pantry', pantry); return pantry; },

  // GET /recipes
  async listRecipes(){ return localGet('recipes', null); },
  // PUT /recipes
  async saveRecipes(recipes){ localSet('recipes', recipes); return recipes; },

  // DELETE /data  (reset everything)
  async clearAll(){ localRemove('settings'); localRemove('pantry'); localRemove('recipes'); },
};

let state = { settings: null, pantry: [], recipes: [] };

let ui = { tab:'recipes', recipeId:null, search:'', pantrySearch:'', pantryEditing:null, pantryAdding:false,
  quick:{ mat:100, pack:10, labor:30, gas:10, delivery:0, overhead:15, yieldQty:10, target:35, sell:0 } };

/* ============================== PERSISTENCE ============================== */
let saveStatus = 'idle'; // idle | saving | saved | error
let persistTimer = null;

async function persistAll(){
  saveStatus = 'saving';
  updateSaveBadge();
  try{
    await Promise.all([
      api.saveSettings(state.settings),
      api.savePantry(state.pantry),
      api.saveRecipes(state.recipes),
    ]);
    saveStatus = 'saved';
  }catch(err){
    console.error('Failed to save data', err);
    saveStatus = 'error';
  }
  updateSaveBadge();
}
function schedulePersist(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(persistAll, 300);
}
function updateSaveBadge(){
  const el = document.getElementById('saveBadge');
  if(!el) return;
  const map = {
    idle:{cls:'', text:'บันทึกอัตโนมัติในเครื่องนี้'},
    saving:{cls:'saving', text:'กำลังบันทึก...'},
    saved:{cls:'', text:'บันทึกแล้ว'},
    error:{cls:'error', text:'บันทึกไม่สำเร็จ'},
  };
  const s = map[saveStatus] || map.idle;
  el.className = 'savebadge '+s.cls;
  el.innerHTML = `<span class="dot"></span>${s.text}`;
}

async function bootstrap(){
  app.innerHTML = `<div style="padding:60px 20px;text-align:center;color:rgba(32,30,29,.55)">กำลังโหลดข้อมูล...</div>`;
  const [settings, pantry, recipes] = await Promise.all([api.getSettings(), api.listPantry(), api.listRecipes()]);
  if(settings && pantry && recipes){
    state = {settings, pantry, recipes};
  } else {
    state.settings = seedSettings();
    state.pantry = seedPantry();
    state.recipes = seedRecipes(state.pantry);
    await persistAll();
  }
  render();
}

/* ============================== HELPERS ============================== */
function findRecipe(id){ return state.recipes.find(r=>r.id===id); }
function findPantry(id){ return state.pantry.find(p=>p.id===id); }
function baht(n){ n = Number(n)||0; return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' บาท'; }
function num2(n){ n=Number(n)||0; return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function pantryUnitCost(p){
  const f = UNIT_FACTOR[p.buyUnit] || 1;
  const denom = (Number(p.buyQty)||0) * f;
  return denom>0 ? (Number(p.buyPrice)||0)/denom : 0;
}
function pantryBaseLabel(p){ return FAMILY_BASE[p.family] || ''; }

function ingUnitCost(ing){
  if(ing.mode==='pantry'){ const p=findPantry(ing.pantryId); return p? pantryUnitCost(p):0; }
  return Number(ing.unitCost)||0;
}
function ingUnitLabel(ing){
  if(ing.mode==='pantry'){ const p=findPantry(ing.pantryId); return p? pantryBaseLabel(p):''; }
  return ing.unit || 'หน่วย';
}
function ingName(ing){
  if(ing.mode==='pantry'){ const p=findPantry(ing.pantryId); return p? p.name : '(ถูกลบจากคลัง)'; }
  return ing.name || '(ไม่มีชื่อ)';
}
function ingCost(ing){ return (Number(ing.qty)||0) * ingUnitCost(ing); }

function calcRecipe(r){
  const mat = r.ingredients.reduce((s,i)=>s+ingCost(i),0);
  const yieldQty = Number(r.yieldQty)||0;
  const pack = (Number(r.packagingCost)||0) * yieldQty;
  const costBasic = mat+pack;
  const perPieceBasic = yieldQty? costBasic/yieldQty : 0;
  const labor = (Number(r.laborRate)||0)*(Number(r.laborHours)||0);
  const overhead = costBasic*((Number(r.overheadPct)||0)/100);
  const fullCost = costBasic+labor+(Number(r.gasCost)||0)+overhead+(Number(r.deliveryCost)||0);
  const perPieceFull = yieldQty? fullCost/yieldQty : 0;
  const suggestRaw = perPieceFull*(1+(Number(r.targetPct)||0)/100);
  const suggest = Math.ceil(suggestRaw*2)/2;
  const sellPrice = Number(r.sellPrice)||0;
  const revenue = sellPrice*yieldQty;
  const profit = revenue-fullCost;
  const margin = revenue>0? profit/revenue*100 : 0;
  const profitBasic = revenue-costBasic;
  const marginBasic = revenue>0? profitBasic/revenue*100 : 0;
  // comparison candidates around the full per-piece cost
  const step = perPieceFull<20?1:(perPieceFull<100?5:10);
  const start = Math.max(step, Math.ceil((perPieceFull*0.9)/step)*step);
  const candidates = [0,1,2,3,4].map(i=>start+i*step);
  const target = (Number(r.targetPct)||0)/100 / (1+(Number(r.targetPct)||0)/100);
  const compare = candidates.map(p=>{
    const rev=p*yieldQty, pf=rev-fullCost, pctOfRev = rev>0? pf/rev*100 : 0;
    let status = pf<=0 ? 'ขาดทุน' : (pctOfRev/100>=target ? 'ถึงเป้า' : 'ต่ำกว่าเป้า');
    return {price:p, profit:pf, pct:pctOfRev, status};
  });
  return {mat,pack,costBasic,perPieceBasic,labor,overhead,fullCost,perPieceFull,suggestRaw,suggest,
    revenue,profit,margin,profitBasic,marginBasic,compare,yieldQty};
}

/* ============================== RENDER ROOT ============================== */
const app = document.getElementById('app');
function render(){ app.innerHTML = shellHTML(); }

function shellHTML(){
  return `
  ${topbarHTML()}
  ${tabsHTML()}
  <main>${viewHTML()}</main>
  <footer class="appfoot">ข้อมูลทั้งหมดถูกบันทึกอัตโนมัติไว้ในเบราว์เซอร์นี้ (localStorage) — กด "ส่งออกข้อมูล" เพื่อสำรองเป็นไฟล์ .json หรือย้ายไปใช้เครื่องอื่น</footer>
  `;
}

function topbarHTML(){
  return `
  <div class="topbar">
    <div class="brand"><span class="k">Food Cost Calculator</span><h1>${esc(state.settings.shopName||'ครัวของหนู')}</h1></div>
    <div class="savebadge" id="saveBadge"><span class="dot"></span>บันทึกอัตโนมัติในเครื่องนี้</div>
    <div class="actions">
      <label class="btn btn-secondary btn-sm filepick">นำเข้าข้อมูล
        <input type="file" accept="application/json" onchange="importData(this)" />
      </label>
      <button class="btn btn-primary btn-sm" onclick="exportData()">ส่งออกข้อมูล (.json)</button>
    </div>
  </div>`;
}

function tabIcon(name){
  const icons = {
    recipes:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9a3 3 0 013 3v11a2 2 0 00-2-2H4z"></path><path d="M20 5v12"></path></svg>',
    pantry:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="13" r="7"></circle><path d="M12 6V3"></path></svg>',
    calc:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="4"></rect><path d="M8 8h8M8 13h3M8 17h3M15 13v4"></path></svg>',
    settings:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3v2M12 19v2M4.5 7.5l1.7 1M17.8 15.5l1.7 1M4.5 16.5l1.7-1M17.8 8.5l1.7-1"></path></svg>',
  };
  return icons[name]||'';
}
function tabsHTML(){
  const tabs = [['recipes','สูตรอาหาร'],['pantry','คลังวัตถุดิบ'],['calc','คำนวณเร็ว'],['settings','ตั้งค่า']];
  return `<div class="tabs">${tabs.map(([k,l])=>`
    <button class="tab-btn ${ui.tab===k?'active':''}" onclick="setTab('${k}')">${tabIcon(k)}${l}</button>
  `).join('')}</div>`;
}

function setTab(t){ ui.tab=t; if(t!=='recipes') ui.recipeId=null; render(); }

function viewHTML(){
  if(ui.tab==='recipes') return ui.recipeId ? recipeEditorHTML(ui.recipeId) : recipesListHTML();
  if(ui.tab==='pantry') return pantryHTML();
  if(ui.tab==='calc') return quickCalcHTML();
  if(ui.tab==='settings') return settingsHTML();
  return '';
}

/* ============================== RECIPES: LIST ============================== */
function recipesListHTML(){
  const q = ui.search.trim().toLowerCase();
  const list = state.recipes.filter(r=> !q || r.name.toLowerCase().includes(q));
  return `
  <div class="toolbar">
    <input class="input" placeholder="ค้นหาเมนู เช่น บราวนี่" value="${esc(ui.search)}" oninput="ui.search=this.value; renderRecipeGrid()" />
    <span class="tag tag-neutral">ทั้งหมด ${state.recipes.length} สูตร</span>
  </div>
  <div class="recipe-grid" id="recipeGrid">${recipeGridInner(list)}</div>
  `;
}
function renderRecipeGrid(){
  const q = ui.search.trim().toLowerCase();
  const list = state.recipes.filter(r=> !q || r.name.toLowerCase().includes(q));
  document.getElementById('recipeGrid').innerHTML = recipeGridInner(list);
}
function recipeGridInner(list){
  const cards = list.map(r=>{
    const c = calcRecipe(r);
    const marginTag = c.margin>=0 ? 'tag-accent-2' : 'tag-danger';
    return `
    <div class="recipe-card" onclick="openRecipe('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div><span class="tag tag-outline">${esc(r.category)} · ${r.yieldQty} ${esc(r.yieldUnit)}/สูตร</span>
          <div class="card-title" style="font-family:var(--font-display);font-size:18px;margin-top:6px">${esc(r.name)}</div>
        </div>
        <span class="tag ${marginTag}">กำไร ${c.margin.toFixed(0)}%</span>
      </div>
      <div class="stats">
        <div class="stat"><div class="l">ต้นทุน/หน่วย</div><div class="v num">${num2(c.perPieceFull)}</div></div>
        <div class="stat"><div class="l">ราคาขาย</div><div class="v num">${num2(r.sellPrice)}</div></div>
        <div class="stat" style="background:var(--color-accent-2-100)"><div class="l" style="color:var(--color-accent-2-800)">กำไร/สูตร</div><div class="v num" style="color:var(--color-accent-2-800)">${num2(c.profit)}</div></div>
      </div>
      <div style="display:flex;gap:6px;margin-top:2px" onclick="event.stopPropagation()">
        <button class="btn btn-secondary btn-sm" onclick="duplicateRecipe('${r.id}')">ทำสำเนา</button>
        <button class="btn btn-danger btn-sm" onclick="deleteRecipe('${r.id}')" style="margin-left:auto">ลบ</button>
      </div>
    </div>`;
  }).join('');
  return cards + `<div class="newcard" onclick="newRecipe()">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    สร้างสูตรใหม่</div>`;
}

function newRecipe(){
  const r = { id:uid('r'), name:'สูตรใหม่', category:'ขนม', yieldQty:10, yieldUnit:'ชิ้น', ingredients:[],
    packagingCost:state.settings.defaultPackaging, laborRate:state.settings.defaultLabor, laborHours:1,
    gasCost:10, deliveryCost:0, overheadPct:state.settings.defaultOverhead, targetPct:state.settings.defaultTarget,
    sellPrice:0, note:'' };
  state.recipes.unshift(r);
  ui.recipeId = r.id;
  render();
  schedulePersist();
}
function openRecipe(id){ ui.recipeId = id; render(); }
function closeEditor(){ ui.recipeId = null; render(); }
function duplicateRecipe(id){
  const r = findRecipe(id); if(!r) return;
  const copy = JSON.parse(JSON.stringify(r));
  copy.id = uid('r'); copy.name = r.name+' (สำเนา)';
  copy.ingredients.forEach(i=> i.id = uid('i'));
  const idx = state.recipes.findIndex(x=>x.id===id);
  state.recipes.splice(idx+1,0,copy);
  render();
  schedulePersist();
}
function deleteRecipe(id){
  if(!confirm('ลบสูตรนี้ทิ้งเลยไหม?')) return;
  state.recipes = state.recipes.filter(r=>r.id!==id);
  if(ui.recipeId===id) ui.recipeId=null;
  render();
  schedulePersist();
}

function ingTableInner(r){

function ingRowHTML(r, idx){
  const ing = r.ingredients[idx];
  const cost = ingCost(ing);
  const isPantry = ing.mode==='pantry';
  return `<div class="ing-row" id="ingrow_${r.id}_${idx}">
    <select class="input mode" onchange="switchIngMode('${r.id}',${idx},this.value)">

      </select>
    ` : `
      <input class="input" placeholder="ชื่อวัตถุดิบ" value="${esc(ing.name||'')}" oninput="updIngField('${r.id}',${idx},'name',this.value)" />

function addIngredient(rid, mode){
  const r = findRecipe(rid);
  if(mode==='pantry'){
    const first = state.pantry[0];
    r.ingredients.push({id:uid('i'), mode:'pantry', pantryId: first? first.id : null, qty:0});
  } else {
    r.ingredients.push({id:uid('i'), mode:'custom', name:'', qty:0, unit:'กรัม', unitCost:0});
  }
  document.getElementById('ingTable_'+rid).innerHTML = ingTableInner(r);
  refreshCalcPanel(rid);
  schedulePersist();
}
function removeIngredient(rid, idx){
  const r = findRecipe(rid);
  r.ingredients.splice(idx,1);
  document.getElementById('ingTable_'+rid).innerHTML = ingTableInner(r);
  refreshCalcPanel(rid);
  schedulePersist();
}
function switchIngMode(rid, idx, mode){
  const r = findRecipe(rid);
  const ing = r.ingredients[idx];
  ing.mode = mode;
  if(mode==='pantry'){ ing.pantryId = state.pantry[0]? state.pantry[0].id : null; }
  else { ing.name = ingName(ing)==='(ถูกลบจากคลัง)'? '' : ingName(ing); ing.unit='กรัม'; ing.unitCost=0; }
  const rowEl = document.getElementById('ingrow_'+rid+'_'+idx);
  rowEl.outerHTML = ingRowHTML(r, idx);
  refreshCalcPanel(rid);
  schedulePersist();
}
function updIngField(rid, idx, field, value){
  const r = findRecipe(rid);
  const ing = r.ingredients[idx];
  ing[field] = (field==='qty'||field==='unitCost') ? value : value;
  const costEl = document.getElementById('ingcost_'+rid+'_'+idx);
  if(costEl) costEl.textContent = num2(ingCost(ing));
  refreshCalcPanel(rid);
  schedulePersist();
}

function updRecipeField(id, field, value){
  const r = findRecipe(id);

}

  let rows = '';
  if(ui.pantryAdding){ rows += pantryEditPanel(null); }

    rows += `<div class="pantry-cat">${esc(cat)}</div>`;

      if(ui.pantryEditing===p.id){ rows += pantryEditPanel(p.id); }
      else { rows += pantryRowView(p); }

      <span class="num" id="pf_preview_${draftKey}" style="font-size:16px">${pantryUnitCost(p).toFixed(2)} บาท / ${pantryBaseLabel(p)}</span>

function refreshPantryUnitChoices(draftKey){
  const family = document.getElementById('pf_family_'+draftKey).value;
  const unitSel = document.getElementById('pf_unit_'+draftKey);
  unitSel.innerHTML = FAMILY_UNITS[family].map(u=>`<option>${u}</option>`).join('');
  refreshPantryPreview(draftKey);
}
function refreshPantryPreview(draftKey){
  const family = document.getElementById('pf_family_'+draftKey).value;
  const price = Number(document.getElementById('pf_price_'+draftKey).value)||0;
  const qty = Number(document.getElementById('pf_qty_'+draftKey).value)||0;
  const unit = document.getElementById('pf_unit_'+draftKey).value;
  const factor = UNIT_FACTOR[unit]||1;
  const denom = qty*factor;
  const uc = denom>0 ? price/denom : 0;
  document.getElementById('pf_preview_'+draftKey).textContent = uc.toFixed(2)+' บาท / '+FAMILY_BASE[family];
}
function cancelPantryEdit(){ ui.pantryEditing=null; ui.pantryAdding=false; render(); }
function savePantryEdit(id, draftKey){
  const name = document.getElementById('pf_name_'+draftKey).value.trim() || 'วัตถุดิบใหม่';
  const category = document.getElementById('pf_cat_'+draftKey).value;
  const family = document.getElementById('pf_family_'+draftKey).value;
  const buyPrice = Number(document.getElementById('pf_price_'+draftKey).value)||0;
  const buyQty = Number(document.getElementById('pf_qty_'+draftKey).value)||0;
  const buyUnit = document.getElementById('pf_unit_'+draftKey).value;
  if(id){
    const p = findPantry(id);
    Object.assign(p, {name,category,family,buyPrice,buyQty,buyUnit});
  } else {
    state.pantry.push({id:uid('p'), name,category,family,buyPrice,buyQty,buyUnit});
  }
  ui.pantryEditing=null; ui.pantryAdding=false;
  render();
  schedulePersist();
}
function deletePantry(id){
  const used = state.recipes.some(r=>r.ingredients.some(i=>i.mode==='pantry' && i.pantryId===id));
  const msg = used ? 'วัตถุดิบนี้ถูกใช้อยู่ในบางสูตร ลบแล้วสูตรนั้นจะคิดต้นทุนส่วนนี้เป็น 0 — ลบเลยไหม?' : 'ลบวัตถุดิบนี้ออกจากคลังไหม?';
  if(!confirm(msg)) return;
  state.pantry = state.pantry.filter(p=>p.id!==id);
  render();
  schedulePersist();
}

          <input class="input" type="number" id="q_mat" value="${ui.quick.mat}" oninput="updQuick('mat',this.value)" /></div>
        <div class="field"><label>ค่าบรรจุภัณฑ์รวม (บาท)</label>
          <input class="input" type="number" id="q_pack" value="${ui.quick.pack}" oninput="updQuick('pack',this.value)" /></div>
        <div class="field"><label>ค่าแรงรวม (บาท)</label>
          <input class="input" type="number" id="q_labor" value="${ui.quick.labor}" oninput="updQuick('labor',this.value)" /></div>
        <div class="field"><label>ค่าแก๊ส/ไฟ (บาท)</label>
          <input class="input" type="number" id="q_gas" value="${ui.quick.gas}" oninput="updQuick('gas',this.value)" /></div>
        <div class="field"><label>ค่าส่ง (บาท)</label>
          <input class="input" type="number" id="q_delivery" value="${ui.quick.delivery}" oninput="updQuick('delivery',this.value)" /></div>
        <div class="field"><label>ค่าโสหุ้ย (%)</label>
          <input class="input" type="number" id="q_overhead" value="${ui.quick.overhead}" oninput="updQuick('overhead',this.value)" /></div>
        <div class="field"><label>ทำได้กี่หน่วย</label>
          <input class="input" type="number" id="q_yield" value="${ui.quick.yieldQty}" oninput="updQuick('yieldQty',this.value)" /></div>
        <div class="field"><label>%กำไรที่ต้องการ</label>
          <input class="input" type="number" id="q_target" value="${ui.quick.target}" oninput="updQuick('target',this.value)" /></div>
      </div>
      <div class="field" style="margin-top:12px">
        <label>ราคาที่จะขายจริง (บาท/หน่วย) — ใส่เพื่อดูกำไรจริง</label>
        <input class="input" type="number" id="q_sell" value="${ui.quick.sell}" oninput="updQuick('sell',this.value)" style="max-width:200px" />
      </div>
    </div>
    <div class="card" id="quickResult">${quickResultInner()}</div>
  </div>`;
}
function updQuick(field, value){ ui.quick[field] = value; document.getElementById('quickResult').innerHTML = quickResultInner(); }
function quickResultInner(){
  const q = ui.quick;
  const mat=Number(q.mat)||0, pack=Number(q.pack)||0, labor=Number(q.labor)||0, gas=Number(q.gas)||0,
    delivery=Number(q.delivery)||0, overheadPct=Number(q.overhead)||0, yieldQty=Number(q.yieldQty)||0, target=Number(q.target)||0, sell=Number(q.sell)||0;
  const baseCost = mat+pack;
  const overhead = baseCost*(overheadPct/100);
  const fullCost = baseCost+labor+gas+overhead+delivery;
  const perUnit = yieldQty? fullCost/yieldQty : 0;
  const suggestRaw = perUnit*(1+target/100);
  const suggest = Math.ceil(suggestRaw*2)/2;
  const revenue = sell*yieldQty;
  const profit = revenue-fullCost;
  const margin = revenue>0? profit/revenue*100:0;
  return `
  <h3 style="font-size:16px;margin-bottom:10px">ผลลัพธ์</h3>
  <div class="calc-line"><span>ต้นทุนรวมทั้งสูตร</span><b>${baht(fullCost)}</b></div>
  <hr class="hr">
  <div class="calc-line"><span>ค่าโสหุ้ยที่บวกเข้าไป</span><b>${baht(overhead)}</b></div>
  <div class="result-tiles">
    <div class="tile a"><div class="l">ต้นทุน/หน่วย</div><div class="v num">${num2(perUnit)}</div></div>
    <div class="tile b"><div class="l">ราคาแนะนำ/หน่วย</div><div class="v num">${num2(suggest)}</div></div>
  </div>
  ${sell>0 ? `
  <div class="grid g2">
    <div class="tile" style="background:var(--color-bg)"><div class="l" style="color:rgba(32,30,29,.55)">ขายได้ทั้งหมด</div><div class="v num" style="font-size:17px">${num2(revenue)}</div></div>
    <div class="tile" style="background:var(--color-accent-2-100)"><div class="l" style="color:var(--color-accent-2-800)">กำไรจริง</div><div class="v num" style="font-size:17px;color:var(--color-accent-2-800)">${num2(profit)}</div></div>
  </div>
  <div style="font-size:12px;color:rgba(32,30,29,.7);margin-top:4px">กำไร ${margin.toFixed(0)}% ของยอดขาย</div>
  ` : `<div class="muted" style="font-size:12.5px">กรอกราคาที่จะขายจริงด้านซ้าย เพื่อดูกำไรจริง</div>`}
  `;
}

/* ============================== SETTINGS ============================== */
function settingsHTML(){
  const s = state.settings;
  return `
  <div class="settings-block">
    <h3>ค่าเริ่มต้น</h3>
    <div class="card grid g2">
      <div class="field"><label>ชื่อร้าน/แบรนด์</label>
        <input class="input" value="${esc(s.shopName)}" oninput="updSettings('shopName',this.value)" /></div>
      <div class="field"><label>ค่าบรรจุภัณฑ์เริ่มต้น (บาท/หน่วย)</label>
        <input class="input" type="number" step="0.05" value="${s.defaultPackaging}" oninput="updSettings('defaultPackaging',this.value)" /></div>
      <div class="field"><label>ค่าแรงเริ่มต้น (บาท/ชม.)</label>
        <input class="input" type="number" step="5" value="${s.defaultLabor}" oninput="updSettings('defaultLabor',this.value)" /></div>
      <div class="field"><label>ค่าโสหุ้ยเริ่มต้น (%)</label>
        <input class="input" type="number" step="1" value="${s.defaultOverhead}" oninput="updSettings('defaultOverhead',this.value)" /></div>
      <div class="field"><label>%กำไรเริ่มต้น</label>
        <input class="input" type="number" step="1" value="${s.defaultTarget}" oninput="updSettings('defaultTarget',this.value)" /></div>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px">ค่าพวกนี้จะถูกใช้เป็นค่าเริ่มต้นทุกครั้งที่กด "สร้างสูตรใหม่" เท่านั้น ไม่กระทบสูตรที่มีอยู่แล้ว</div>
  </div>

  <div class="settings-block">
    <h3>ข้อมูล</h3>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="notice" style="margin:0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8c491a" stroke-width="2.75" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M12 11v5"></path></svg>
        <div>แอปนี้บันทึกข้อมูลอัตโนมัติไว้ใน localStorage ของเบราว์เซอร์นี้ — ข้อมูลจะยังอยู่แม้ปิดแท็บหรือรีเฟรชหน้า แต่ผูกกับเครื่อง/เบราว์เซอร์นี้เท่านั้น กด "ส่งออกข้อมูล" เป็นประจำเพื่อสำรองเป็นไฟล์ แล้วใช้ "นำเข้าข้อมูล" เพื่อย้ายไปเครื่องอื่น</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="exportData()">ส่งออกข้อมูล (.json)</button>
        <label class="btn btn-secondary filepick">นำเข้าข้อมูล<input type="file" accept="application/json" onchange="importData(this)" /></label>
        <button class="btn btn-secondary" onclick="loadDemoData()">โหลดข้อมูลตัวอย่าง</button>
        <button class="btn btn-danger" onclick="clearAllData()">ล้างข้อมูลทั้งหมด</button>
      </div>
    </div>
  </div>
  `;
}
function updSettings(field, value){ state.settings[field] = value; schedulePersist(); }
function loadDemoData(){
  if(!confirm('โหลดข้อมูลตัวอย่างทับข้อมูลปัจจุบันเลยไหม?')) return;
  state.settings = seedSettings();
  state.pantry = seedPantry();
  state.recipes = seedRecipes(state.pantry);
  ui.recipeId=null;
  render();
  schedulePersist();
}
function clearAllData(){
  if(!confirm('ล้างข้อมูลทั้งหมด (สูตร + คลังวัตถุดิบ) เลยไหม? กู้คืนไม่ได้ถ้าไม่ได้ส่งออกไว้ก่อน')) return;
  state.pantry = [];
  state.recipes = [];
  ui.recipeId=null;
  render();
  schedulePersist();
}

/* ============================== IMPORT / EXPORT ============================== */
function exportData(){
  const payload = JSON.stringify({ settings: state.settings, pantry: state.pantry, recipes: state.recipes, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = 'food-cost-data-'+stamp+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importData(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.pantry || !data.recipes) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
      state.settings = Object.assign(seedSettings(), data.settings||{});
      state.pantry = data.pantry;
      state.recipes = data.recipes;
      ui.recipeId = null;
      render();
      schedulePersist();
    } catch(err){
      alert('นำเข้าข้อมูลไม่สำเร็จ: '+err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ============================== INIT ============================== */
bootstrap();
</script>
</body>
</html>
